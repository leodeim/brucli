info:
  name: GetPet
  type: http
  seq: 2
  tags:
    - read

http:
  method: GET
  url: "{{baseUrl}}/v1/pets/:petId"
  params:
    - name: petId
      value: "{{petId}}"
      type: path
      description: petId is the id of the pet.
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Returns one pet; 404 for an unknown id.
